name: Publish Surge rules

on:
  schedule:
    - cron: '23 23 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'convert.py'
      - 'test_convert.py'
      - 'verify.js'
      - 'requirements.txt'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  group: publish-surge-rules
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Download upstream snapshot
        run: git clone --depth 1 https://github.com/Hawaiine/mihomo-rules.git upstream
      - name: Convert and validate
        env:
          BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/Surge
        run: |
          python -m unittest -v
          python convert.py --upstream upstream --output Surge --base-url "$BASE_URL" --revision "$(git -C upstream rev-parse HEAD)"
          node verify.js Surge
      - name: Publish validated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Surge
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated Surge rule subscriptions'
            git push origin HEAD:main
          fi
